<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper footer-inner">
    <div class="footer-info">
      <span class="p-name">{{ site.author.name | escape }}</span>
      {%- if site.email %} · <a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a>{% endif %}
      <div class="footer-legal">
        <a href="/impressum/">Impressum</a> · <a href="/datenschutz/">Datenschutz</a>
      </div>
    </div>

    <div class="footer-social">
      {%- include social.html -%}
    </div>
  </div>

</footer>

<script>
  document.querySelectorAll('.js-phone').forEach(function (el) {
    var n = '+' + atob(el.dataset.p);
    el.textContent = n;
    el.href = 'tel:' + n.replace(/\s/g, '');
  });
</script>
