---
layout: default
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {{ page.date | date: "%b %-d, %Y" }}
      </time>
    </p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

  <nav class="post-nav" aria-label="More posts">
    {%- if page.previous %}
    <a class="post-nav-link post-nav-prev" href="{{ page.previous.url | relative_url }}">
      <span class="post-nav-label">← Previous</span>{{ page.previous.title | escape }}
    </a>
    {%- endif %}
    {%- if page.next %}
    <a class="post-nav-link post-nav-next" href="{{ page.next.url | relative_url }}">
      <span class="post-nav-label">Next →</span>{{ page.next.title | escape }}
    </a>
    {%- endif %}
  </nav>
  <p class="post-back"><a href="{{ "/" | relative_url }}">← All posts</a></p>

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": "Hendrik Schick",
    "url": "https://hendrik-schick.me"
  },
  "description": {{ page.description | default: page.excerpt | strip_html | jsonify }},
  "url": "{{ site.url }}{{ page.url }}"
}
</script>
